function initScoreTool(card){
  const tabButtons = card.querySelectorAll('.score-tabs button');
  const toggleBtn = card.querySelector('[data-action="toggle-roster"]');
  const editor = card.querySelector('.roster-editor');
  const individualEditor = card.querySelector('.individual-editor');
  const groupEditor = card.querySelector('.group-editor');
  const studentsInput = card.querySelector('.students-input');
  const groupsInput = card.querySelector('.groups-input');
  const saveBtn = card.querySelector('[data-action="save-roster"]');
  const grid = card.querySelector('.score-grid');
  const podium = card.querySelector('.score-podium');
  const podiumWrap = card.querySelector('.score-podium-wrap');
  const podiumConfettiCanvas = card.querySelector('.podium-confetti-canvas');
  const individualOnlyBtns = card.querySelectorAll('.individual-only');
  const groupOnlyBtns = card.querySelectorAll('.group-only');

  let currentTab = 'individual';
  const activeBursts = new Set();

  function spawnBurst(canvas){
    const { ctx, cssW, cssH } = setupHiDPICanvas(canvas, canvas);
    const particles = [];
    for(let i=0;i<14;i++){
      particles.push({
        x: cssW/2 + (Math.random()-0.5)*24,
        y: cssH*0.82,
        vx: (Math.random()-0.5)*1.8,
        vy: -(2 + Math.random()*2.4),
        rotation: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.3,
        isCoin: Math.random() < 0.5,
        size: 9 + Math.random()*7,
        life: 42 + Math.random()*18,
        maxLife: 60
      });
    }
    function frame(){
      ctx.clearRect(0, 0, cssW, cssH);
      let alive = false;
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.rotation += p.vr; p.life -= 1;
        if(p.life > 0){
          alive = true;
          const alpha = Math.max(0, p.life/p.maxLife);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = alpha;
          if(p.isCoin){
            ctx.fillStyle = '#FFD166';
            ctx.beginPath(); ctx.arc(0, 0, p.size*0.5, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = '#E8A93C'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.fillStyle = '#FFF3C4';
            ctx.font = `${p.size*0.5}px sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          } else {
            ctx.fillStyle = '#FFB37B';
            drawStarShape(ctx, 0, 0, 5, p.size*0.5, p.size*0.22);
            ctx.fill();
          }
          ctx.restore();
        }
      });
      ctx.globalAlpha = 1;
      if(alive){
        const raf = requestAnimationFrame(frame);
        activeBursts.add(raf);
      }
    }
    const raf = requestAnimationFrame(frame);
    activeBursts.add(raf);
  }

  function renderGrid(){
    grid.innerHTML = '';
    const isIndividual = currentTab === 'individual';
    grid.classList.toggle('grid-10col', isIndividual);
    grid.classList.toggle('group-mode', !isIndividual);
    const scoreMap = classState.scores[currentTab];
    const items = isIndividual ? sortedStudents() : classState.groups;

    if(items.length === 0){
      const empty = document.createElement('div');
      empty.className = 'placeholder-note';
      empty.textContent = isIndividual ? '（尚未設定名單，點上方「設定名單」新增）' : '（尚未設定小組，點上方「設定名單」新增）';
      grid.appendChild(empty);
      return;
    }

    // 找出本輪最高分（>0 才給皇冠，避免大家都 0 分時全部戴皇冠）
    let topScore = 0;
    items.forEach(item => {
      const key = isIndividual ? String(item.seat) : item;
      const s = scoreMap[key] || 0;
      if(s > topScore) topScore = s;
    });

    items.forEach(item => {
      const key = isIndividual ? String(item.seat) : item;
      const label = isIndividual ? `${item.seat}號 ${escapeHtml(item.name)}` : escapeHtml(item);
      const score = scoreMap[key] || 0;
      const isChampion = topScore > 0 && score === topScore;

      const cardEl = document.createElement('div');
      cardEl.className = 'score-card';
      cardEl.innerHTML = `
        ${isChampion ? '<div class="crown">👑</div>' : ''}
        <canvas class="burst-canvas"></canvas>
        <div class="name">${label}</div>
        <div class="value">${score}</div>
        <div class="btn-row">
          <button class="minus">－</button>
          <button class="plus">＋</button>
        </div>
      `;
      const valueEl = cardEl.querySelector('.value');
      const burstCanvas = cardEl.querySelector('.burst-canvas');

      cardEl.querySelector('.plus').addEventListener('click', () => {
        updateState(s => {
          s.scores[currentTab][key] = (s.scores[currentTab][key] || 0) + 1;
        });
        valueEl.textContent = classState.scores[currentTab][key];
        spawnBurst(burstCanvas);
        renderGrid(); // 分數可能改變榜首，重新渲染以更新皇冠
      });
      cardEl.querySelector('.minus').addEventListener('click', () => {
        updateState(s => {
          s.scores[currentTab][key] = (s.scores[currentTab][key] || 0) - 1;
        });
        valueEl.textContent = classState.scores[currentTab][key];
        renderGrid();
      });

      grid.appendChild(cardEl);
    });
  }

  function renderPodium(animate){
    const isIndividual = currentTab === 'individual';
    let ranked;
    if(isIndividual){
      ranked = sortedStudents()
        .map(st => ({ key: String(st.seat), label: `${st.seat}號 ${st.name}`, total: classState.scoreHistory.individual[String(st.seat)] || 0 }))
        .filter(r => r.total > 0)
        .sort((a,b) => b.total - a.total)
        .slice(0, 5);
    } else {
      ranked = classState.groups
        .map(g => ({ key: g, label: g, total: classState.scoreHistory.group[g] || 0 }))
        .filter(r => r.total > 0)
        .sort((a,b) => b.total - a.total)
        .slice(0, 6);
    }

    if(ranked.length === 0){
      podium.innerHTML = '';
      return;
    }

    const medals = ['🥇','🥈','🥉'];
    const title = isIndividual ? '🏆 個人累計榮譽榜（前5名）' : '🏆 小組累計榮譽榜（前6名）';
    let html = `<div class="podium-title">${title}</div><div class="podium-list${animate ? ' reveal' : ''}">`;
    ranked.forEach((r, i) => {
      const medal = medals[i] || `${i+1}`;
      const delay = animate ? ` style="animation-delay:${i*140}ms"` : '';
      html += `<div class="podium-row rank-${i+1}"${delay}><span class="podium-medal">${medal}</span><span class="podium-name">${escapeHtml(r.label)}</span><span class="podium-score">${r.total} 分</span></div>`;
    });
    html += '</div>';
    podium.innerHTML = html;
  }

  card.querySelector('[data-action="add-all"]').addEventListener('click', () => {
    const isIndividual = currentTab === 'individual';
    const items = isIndividual ? sortedStudents() : classState.groups;
    updateState(s => {
      items.forEach(item => {
        const key = isIndividual ? String(item.seat) : item;
        s.scores[currentTab][key] = (s.scores[currentTab][key] || 0) + 1;
      });
    });
    renderGrid();
    showToast('➕ 全班都加了 1 分！');
  });

  card.querySelector('[data-action="reset-scores"]').addEventListener('click', () => {
    updateState(s => {
      s.scores[currentTab] = {};
    });
    renderGrid();
    showToast(currentTab === 'individual' ? '🔄 個人本輪分數已歸零！' : '🔄 小組本輪分數已歸零！');
  });

  card.querySelector('[data-action="toggle-podium"]').addEventListener('click', () => {
    const willShow = podiumWrap.classList.contains('hidden');
    podiumWrap.classList.toggle('hidden', !willShow);
    if(willShow) renderPodium();
  });

  function burstPodiumConfetti(){
    const { ctx, cssW, cssH } = setupHiDPICanvas(podiumConfettiCanvas, podiumWrap);
    const colors = ['#FFD166', '#FF9FBE', '#8AD8F0', '#A8E6A1', '#C792EA'];
    const particles = [];
    for(let i=0;i<60;i++){
      particles.push({
        x: cssW/2 + (Math.random()-0.5)*cssW*0.6,
        y: -10 - Math.random()*cssH*0.4,
        vx: (Math.random()-0.5)*1.6,
        vy: 1.5 + Math.random()*2.5,
        rotation: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.25,
        color: colors[Math.floor(Math.random()*colors.length)],
        shape: Math.random() < 0.5 ? 'star' : 'rect',
        size: 6 + Math.random()*7,
        life: 110 + Math.random()*50,
        maxLife: 160
      });
    }
    function frame(){
      ctx.clearRect(0, 0, cssW, cssH);
      let alive = false;
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.rotation += p.vr; p.life -= 1;
        if(p.life > 0 && p.y < cssH + 20){
          alive = true;
          const alpha = Math.max(0, p.life/p.maxLife);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if(p.shape === 'star'){
            drawStarShape(ctx, 0, 0, 5, p.size*0.5, p.size*0.22);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
          }
          ctx.restore();
        }
      });
      ctx.globalAlpha = 1;
      if(alive) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  card.querySelector('[data-action="accumulate-history"]').addEventListener('click', () => {
    updateState(s => {
      sortedStudents().forEach(st => {
        const key = String(st.seat);
        const add = s.scores.individual[key] || 0;
        s.scoreHistory.individual[key] = (s.scoreHistory.individual[key] || 0) + add;
      });
    });
    podiumWrap.classList.remove('hidden');
    renderPodium(true);
    burstPodiumConfetti();
    showToast('💾🏆 本週分數已累計，榮譽榜更新囉！');
  });

  card.querySelector('[data-action="reset-history"]').addEventListener('click', () => {
    updateState(s => { s.scoreHistory.individual = {}; });
    renderPodium();
    showToast('🗑️ 個人榮譽榜已重置！');
  });

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      tabButtons.forEach(b => b.classList.toggle('active', b === btn));
      const isIndividual = currentTab === 'individual';
      individualOnlyBtns.forEach(b => b.classList.toggle('hidden', !isIndividual));
      groupOnlyBtns.forEach(b => b.classList.toggle('hidden', isIndividual));
      if(!isIndividual) podiumWrap.classList.add('hidden');
      renderGrid();
      renderPodium();
    });
  });

  // Bind click for input-roster-btn
  card.querySelector('[data-action="input-roster-btn"]').addEventListener('click', () => {
    const willShow = editor.classList.contains('hidden');
    editor.classList.toggle('hidden');
    if(willShow){
      individualEditor.classList.remove('hidden');
      groupEditor.classList.add('hidden');
      studentsInput.value = sortedStudents().map(s => `${s.seat} ${s.name}`).join('\n');
      studentsInput.focus();
    }
  });

  // Bind click for add-group-btn
  card.querySelector('[data-action="add-group-btn"]').addEventListener('click', () => {
    const nextNum = classState.groups.length + 1;
    const groupName = window.prompt("請輸入新增小組的名稱:", "第" + nextNum + "組");
    if (groupName && groupName.trim()) {
      updateState(s => {
        s.groups.push(groupName.trim());
      });
      renderGrid();
      showToast(`➕ 已新增小組：${groupName.trim()}`);
    }
  });

  // Bind click for remove-group-btn
  card.querySelector('[data-action="remove-group-btn"]').addEventListener('click', () => {
    if (classState.groups.length === 0) {
      showToast("⚠️ 目前沒有任何小組！");
      return;
    }
    const lastGroup = classState.groups[classState.groups.length - 1];
    if (window.confirm(`確定要刪除最後一個小組【${lastGroup}】嗎？`)) {
      updateState(s => {
        s.groups.pop();
      });
      renderGrid();
      showToast(`🗑️ 已刪除小組：${lastGroup}`);
    }
  });

  toggleBtn.addEventListener('click', () => {
    const willShow = editor.classList.contains('hidden');
    editor.classList.toggle('hidden');
    if(willShow){
      studentsInput.value = sortedStudents().map(s => `${s.seat} ${s.name}`).join('\n');
      groupsInput.value = classState.groups.join('\n');
    }
  });

  card.querySelectorAll('.score-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      individualEditor.classList.toggle('hidden', btn.dataset.tab !== 'individual');
      groupEditor.classList.toggle('hidden', btn.dataset.tab !== 'group');
    });
  });

  saveBtn.addEventListener('click', () => {
    const students = parseRosterLines(studentsInput.value);
    const groups = parseListLines(groupsInput.value);
    updateState(s => {
      if(students.length) s.students = students;
      if(groups.length) s.groups = groups;
    });
    editor.classList.add('hidden');
    renderGrid();
    showToast('💾 名單已更新！');
  });

  renderGrid();
  renderPodium();

  return {
    destroy(){
      activeBursts.forEach(id => cancelAnimationFrame(id));
      activeBursts.clear();
    }
  };
}

/* ============================================================
   4.10 📝 作業追蹤器（表格勾叉、篩選未完成、匯出匯入）
   ============================================================ */
function initHomeworkTool(card){
  const toggleBtn = card.querySelector('[data-action="toggle-roster"]');
  const editor = card.querySelector('.roster-editor');
  const studentsInput = card.querySelector('.students-input');
  const itemsInput = card.querySelector('.items-input');
  const saveBtn = card.querySelector('[data-action="save-roster"]');
  const zonesWrap = card.querySelector('.homework-zones');
  const filterBtn = card.querySelector('[data-action="toggle-filter"]');
  const importInput = card.querySelector('.import-input');

  let showOnlyUnfinished = false;

  function renderTable(){
    const students = sortedStudents();
    const items = classState.homeworkItems;

    if(students.length === 0 || items.length === 0){
      zonesWrap.innerHTML = `<div class="placeholder-note">（請先點上方「設定名單／作業項目」新增資料）</div>`;
      return;
    }

    // 分成三區，一區最多10位學生（例如 9欄11列：1欄座號姓名 + 最多8項作業，1列標題 + 最多10列學生）
    const zones = [students.slice(0,10), students.slice(10,20), students.slice(20,30)];

    let html = '';
    zones.forEach((zoneStudents, zoneIdx) => {
      if(zoneStudents.length === 0) return;
      let rows = zoneStudents;
      if(showOnlyUnfinished){
        rows = rows.filter(st => items.some((_, idx) => !classState.homeworkRecords[`${st.seat}-${idx}`]));
      }
      html += `<table class="homework-zone-table"><thead><tr><th>座號/姓名</th>`;
      items.forEach((it, idx) => {
        html += `<th class="item-header" data-idx="${idx}" data-zone="${zoneIdx}" title="點擊切換這一區的「${escapeHtml(it)}」全勾／全叉">${escapeHtml(it)}</th>`;
      });
      html += '</tr></thead><tbody>';
      if(rows.length === 0){
        html += `<tr><td colspan="${items.length+1}" class="placeholder-note">🎉</td></tr>`;
      } else {
        rows.forEach(st => {
          html += `<tr><td class="name-cell">${String(st.seat).padStart(2,'0')} ${escapeHtml(st.name)}</td>`;
          items.forEach((_, idx) => {
            const done = !!classState.homeworkRecords[`${st.seat}-${idx}`];
            html += `<td class="homework-cell ${done ? 'done':'undone'}" data-seat="${st.seat}" data-idx="${idx}">${done ? '✅' : '❌'}</td>`;
          });
          html += '</tr>';
        });
      }
      html += '</tbody></table>';
    });
    zonesWrap.innerHTML = html || `<div class="placeholder-note">（尚無學生資料）</div>`;
  }

  zonesWrap.addEventListener('click', (e) => {
    const header = e.target.closest('.item-header');
    if(header){
      const idx = parseInt(header.dataset.idx, 10);
      const zoneIdx = parseInt(header.dataset.zone, 10);
      const zoneStudents = sortedStudents().slice(zoneIdx*10, zoneIdx*10+10);
      const allDone = zoneStudents.length > 0 && zoneStudents.every(st => !!classState.homeworkRecords[`${st.seat}-${idx}`]);
      updateState(s => {
        zoneStudents.forEach(st => { s.homeworkRecords[`${st.seat}-${idx}`] = !allDone; });
      });
      renderTable();
      return;
    }
    const cell = e.target.closest('.homework-cell');
    if(!cell) return;
    const key = `${cell.dataset.seat}-${cell.dataset.idx}`;
    updateState(s => { s.homeworkRecords[key] = !s.homeworkRecords[key]; });
    renderTable();
  });

  toggleBtn.addEventListener('click', () => {
    const willShow = editor.classList.contains('hidden');
    editor.classList.toggle('hidden');
    if(willShow){
      studentsInput.value = sortedStudents().map(s => `${s.seat} ${s.name}`).join('\n');
      itemsInput.value = classState.homeworkItems.join('\n');
    }
  });

  saveBtn.addEventListener('click', () => {
    const students = parseRosterLines(studentsInput.value);
    const items = parseListLines(itemsInput.value);
    updateState(s => {
      if(students.length) s.students = students;
      if(items.length) s.homeworkItems = items;
    });
    editor.classList.add('hidden');
    renderTable();
    showToast('💾 設定已更新！');
  });

  card.querySelector('[data-action="fill-done"]').addEventListener('click', () => {
    updateState(s => {
      sortedStudents().forEach(st => {
        s.homeworkItems.forEach((_, idx) => { s.homeworkRecords[`${st.seat}-${idx}`] = true; });
      });
    });
    renderTable();
  });

  card.querySelector('[data-action="fill-undone"]').addEventListener('click', () => {
    updateState(s => {
      sortedStudents().forEach(st => {
        s.homeworkItems.forEach((_, idx) => { s.homeworkRecords[`${st.seat}-${idx}`] = false; });
      });
    });
    renderTable();
  });

  filterBtn.addEventListener('click', () => {
    showOnlyUnfinished = !showOnlyUnfinished;
    filterBtn.classList.toggle('primary', showOnlyUnfinished);
    filterBtn.textContent = showOnlyUnfinished ? '🔍 顯示全部' : '🔍 只顯示尚未完成';
    renderTable();
  });

  card.querySelector('[data-action="export"]').addEventListener('click', exportData);
  importInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importData(file);
  });

  renderTable();

  return { destroy(){} };
}

/* ============================================================
   4.11 📋 考試計時器（小烏龜爬向終點旗，最後5分鐘閃紅警示）
   ============================================================ */
function initExamTool(card){
  const canvas = card.querySelector('.tool-canvas');
  const wrap = card.querySelector('.exam-canvas-wrap');
  const startInput = card.querySelector('.exam-start-input');
  const endInput = card.querySelector('.exam-end-input');
  const expectedInput = card.querySelector('.exam-expected-input');
  const presentInput = card.querySelector('.exam-present-input');
  const absentDisplay = card.querySelector('.exam-absent-display');
  const warningBtn = card.querySelector('[data-toggle="warning"]');
  const chimeBtn = card.querySelector('[data-toggle="chime"]');
  const displayBtn = card.querySelector('[data-toggle="display"]');

  let ctx, cssW = 0, cssH = 0;
  let rafId = null;
  let chimedForThisEnd = false; // 避免同一次結束時間重複播放鐘聲
  let attendanceSaveTimer = null;
  let timeSaveTimer = null;

  startInput.value = classState.examStartTime || '08:40';
  endInput.value = classState.examEndTime || '09:20';
  expectedInput.value = classState.examExpected;
  presentInput.value = classState.examPresent;

  function updateAbsentDisplay(){
    const expected = parseInt(expectedInput.value, 10) || 0;
    const present = parseInt(presentInput.value, 10) || 0;
    absentDisplay.textContent = `缺考 ${Math.max(0, expected - present)} 人`;
  }
  updateAbsentDisplay();

  function saveAttendance(){
    clearTimeout(attendanceSaveTimer);
    attendanceSaveTimer = setTimeout(() => {
      updateState(s => {
        s.examExpected = parseInt(expectedInput.value, 10) || 0;
        s.examPresent = parseInt(presentInput.value, 10) || 0;
      });
    }, 400);
  }
  expectedInput.addEventListener('input', () => { updateAbsentDisplay(); saveAttendance(); });
  presentInput.addEventListener('input', () => { updateAbsentDisplay(); saveAttendance(); });

  function saveTimeRange(){
    clearTimeout(timeSaveTimer);
    timeSaveTimer = setTimeout(() => {
      updateState(s => {
        s.examStartTime = startInput.value || '08:40';
        s.examEndTime = endInput.value || '09:20';
      });
      chimedForThisEnd = false; // 時間重新設定後，允許再次於新的結束時刻播放鐘聲
    }, 400);
  }
  startInput.addEventListener('input', saveTimeRange);
  endInput.addEventListener('input', saveTimeRange);

  function syncToggleButtons(){
    warningBtn.classList.toggle('active', classState.examWarningEnabled);
    chimeBtn.classList.toggle('active', classState.examChimeEnabled);
    displayBtn.classList.toggle('active', classState.examDisplayMode === 'track');
    displayBtn.title = classState.examDisplayMode === 'track'
      ? '時間顯示切換｜目前：智慧考試追蹤（點擊切換成標準時鐘）'
      : '時間顯示切換｜目前：標準時鐘（點擊切換成智慧考試追蹤）';
    if(!classState.examWarningEnabled){ wrap.classList.remove('warning', 'warn-yellow'); }
  }
  syncToggleButtons();

  function setupCanvas(){
    const r = setupHiDPICanvas(canvas, wrap);
    ctx = r.ctx; cssW = r.cssW; cssH = r.cssH;
  }

  function fmt(s){
    s = Math.max(0, Math.ceil(s));
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    if(h > 0) return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function parseTimeToday(hhmm){
    const parts = (hhmm || '00:00').split(':');
    const h = parseInt(parts[0], 10) || 0;
    const m = parseInt(parts[1], 10) || 0;
    const d = new Date();
    d.setHours(h, m, 0, 0);
    return d;
  }

  function getExamWindow(){
    const start = parseTimeToday(startInput.value);
    let end = parseTimeToday(endInput.value);
    if(end <= start) end = new Date(end.getTime() + 24*3600*1000); // 避免結束時間設定得比開始早時出現負數
    return { start, end };
  }

  function drawClockMode(){
    ctx.clearRect(0, 0, cssW, cssH);
    const now = new Date();
    const timeStr = String(now.getHours()).padStart(2,'0') + ':' +
                    String(now.getMinutes()).padStart(2,'0');
    ctx.fillStyle = '#5C4B51';
    ctx.font = `700 ${Math.max(14, cssH*0.12)}px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('🕐 目前時間', cssW/2, cssH*0.26);
    ctx.font = `800 ${Math.max(48, cssH*0.5)}px 'Baloo 2', sans-serif`;
    ctx.fillText(timeStr, cssW/2, cssH*0.68);
  }

  function drawTrackMode(){
    ctx.clearRect(0, 0, cssW, cssH);
    const { start, end } = getExamWindow();
    const now = new Date();
    const totalMs = end - start;
    const trackY = cssH * 0.9;
    const padding = cssW * 0.1;
    const trackW = cssW - padding*2;

    let fraction = 0, remainingSeconds = totalMs/1000, status = '☕ 尚未開始';
    if(now >= end){
      status = '✅ 考試結束';
      fraction = 1;
      remainingSeconds = 0;
    } else if(now >= start){
      status = '🟢 考試進行中';
      fraction = totalMs > 0 ? (now - start)/totalMs : 0;
      remainingSeconds = (end - now)/1000;
    }

    // 狀態文字（最上方）
    ctx.fillStyle = '#5C4B51';
    ctx.font = `700 ${Math.max(12, cssH*0.07)}px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText(`${status}（${startInput.value}～${endInput.value}）`, cssW/2, cssH*0.13);

    // 數字鐘（往下移，跟狀態文字、下方烏龜進度條都保持距離）
    ctx.font = `800 ${Math.max(46, cssH*0.36)}px 'Baloo 2', sans-serif`;
    ctx.fillText(fmt(remainingSeconds), cssW/2, cssH*0.58);

    // 時間進度條（放在最下方，跟數字鐘保持距離避免重疊）
    ctx.strokeStyle = '#E8D9C5';
    ctx.lineWidth = Math.max(4, cssH*0.035);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(padding, trackY);
    ctx.lineTo(padding + trackW, trackY);
    ctx.stroke();

    ctx.strokeStyle = '#A8E6A1';
    ctx.beginPath();
    ctx.moveTo(padding, trackY);
    ctx.lineTo(padding + trackW*fraction, trackY);
    ctx.stroke();
    ctx.lineCap = 'butt';

    const turtleX = padding + trackW*fraction;
    const emojiSize = Math.max(20, cssH*0.14);
    ctx.font = `${emojiSize}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.save();
    ctx.translate(turtleX, trackY - Math.max(4, cssH*0.015));
    ctx.scale(-1, 1); // 翻轉烏龜，讓牠面朝終點旗子前進的方向
    ctx.fillText('🐢', 0, 0);
    ctx.restore();
    ctx.fillText('🏁', padding + trackW, trackY - Math.max(4, cssH*0.015));
  }

  function updateWarningAndChime(){
    const { start, end } = getExamWindow();
    const now = new Date();
    const inExam = now >= start && now < end;
    const remainingSeconds = inExam ? (end - now)/1000 : null;

    if(classState.examWarningEnabled && remainingSeconds !== null){
      const redZone = remainingSeconds <= 180;
      const yellowZone = remainingSeconds > 180 && remainingSeconds <= 300;
      wrap.classList.toggle('warning', redZone);
      wrap.classList.toggle('warn-yellow', yellowZone);
    } else {
      wrap.classList.remove('warning', 'warn-yellow');
    }

    if(now >= end){
      if(!chimedForThisEnd && classState.examChimeEnabled){
        chimedForThisEnd = true;
        playWestminsterChime();
      }
    } else {
      chimedForThisEnd = false;
    }
  }

  function render(){
    updateWarningAndChime();
    if(classState.examDisplayMode === 'clock'){
      drawClockMode();
    } else {
      drawTrackMode();
    }
  }

  function loop(){
    render();
    rafId = requestAnimationFrame(loop);
  }

  warningBtn.addEventListener('click', () => {
    updateState(s => { s.examWarningEnabled = !s.examWarningEnabled; });
    syncToggleButtons();
  });
  chimeBtn.addEventListener('click', () => {
    updateState(s => { s.examChimeEnabled = !s.examChimeEnabled; });
    syncToggleButtons();
  });
  displayBtn.addEventListener('click', () => {
    updateState(s => { s.examDisplayMode = s.examDisplayMode === 'track' ? 'clock' : 'track'; });
    syncToggleButtons();
  });

  const ro = new ResizeObserver(() => setupCanvas());
  ro.observe(wrap);
  setupCanvas();
  loop();

  return {
    destroy(){
      cancelAnimationFrame(rafId);
      clearTimeout(attendanceSaveTimer);
      clearTimeout(timeSaveTimer);
      ro.disconnect();
    }
  };
}

/* ============================================================
   4.12 🦷 潔牙完成表（點號碼切換今天的刷牙狀態）
   ============================================================ */
function playToothClickSound(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(700, now);
    osc.frequency.exponentialRampToValueAtTime(1000, now + 0.08);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.25, now + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.14);
    setTimeout(() => audioCtx.close().catch(()=>{}), 250);
  }catch(e){ /* 忽略 */ }
}

function playTeethCompleteMelody(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    // Do - Mi - Sol - （頓） - Do - La - （頓） - Do
    const seq = [
      { f: 523.25, d: 0.28 },
      { f: 659.25, d: 0.28 },
      { f: 783.99, d: 0.32 },
      { f: null,   d: 0.16 },
      { f: 523.25, d: 0.28 },
      { f: 880.00, d: 0.32 },
      { f: null,   d: 0.16 },
      { f: 523.25, d: 0.55 }
    ];
    let t = now;
    seq.forEach(note => {
      if(note.f){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = note.f;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + note.d);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + note.d + 0.05);
      }
      t += note.d;
    });
    setTimeout(() => audioCtx.close().catch(()=>{}), (t - now) * 1000 + 600);
  }catch(e){ console.warn('無法播放完成音效', e); }
}

function initTeethTool(card){
  const dateEl = card.querySelector('.teeth-date');
  const totalValueEl = card.querySelector('.teeth-total-value');
  const totalMinusBtn = card.querySelector('[data-action="total-minus"]');
  const totalPlusBtn = card.querySelector('[data-action="total-plus"]');
  const resetTodayBtn = card.querySelector('[data-action="reset-today"]');
  const grid = card.querySelector('.teeth-grid');
  const celebrate = card.querySelector('.teeth-celebrate');
  const confettiCanvas = card.querySelector('.confetti-canvas');
  const step1 = card.querySelector('.celebrate-step1');
  const step2 = card.querySelector('.celebrate-step2');
  const nextBtn = card.querySelector('[data-action="show-reminder"]');

  let wasComplete = false; // 避免每次 render 都重複播放過關音效
  let celebrateDismissed = false; // 老師按「返回列表」後，即使已全部完成也先顯示牙齒列表
  let confettiRafId = null;

  function burstConfetti(){
    if(confettiRafId) cancelAnimationFrame(confettiRafId);
    const { ctx, cssW, cssH } = setupHiDPICanvas(confettiCanvas, celebrate);
    const colors = ['#FF9FBE', '#8AD8F0', '#A8E6A1', '#FFD166', '#C792EA'];
    const particles = [];
    for(let i=0;i<80;i++){
      particles.push({
        x: Math.random()*cssW,
        y: -20 - Math.random()*cssH*0.6,
        vx: (Math.random()-0.5)*2,
        vy: 2 + Math.random()*3,
        rotation: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.25,
        color: colors[Math.floor(Math.random()*colors.length)],
        shape: Math.random() < 0.5 ? 'star' : 'rect',
        size: 8 + Math.random()*8,
        life: 150 + Math.random()*60,
        maxLife: 210
      });
    }
    function frame(){
      ctx.clearRect(0, 0, cssW, cssH);
      let alive = false;
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rotation += p.vr; p.life -= 1;
        if(p.life > 0 && p.y < cssH + 30){
          alive = true;
          const alpha = Math.max(0, p.life/p.maxLife);
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if(p.shape === 'star'){
            drawStarShape(ctx, 0, 0, 5, p.size*0.5, p.size*0.22);
            ctx.fill();
          } else {
            ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
          }
          ctx.restore();
        }
      });
      ctx.globalAlpha = 1;
      if(alive) confettiRafId = requestAnimationFrame(frame);
    }
    confettiRafId = requestAnimationFrame(frame);
  }

  function render(){
    dateEl.textContent = `📅 ${todayKey()}（點牙齒切換今天的刷牙狀態）`;
    totalValueEl.textContent = `${classState.teethTotal} 人`;

    const total = classState.teethTotal;
    const todayRecord = classState.teeth[todayKey()] || {};
    let doneCount = 0;
    for(let n=1; n<=total; n++){ if(todayRecord[n]) doneCount++; }
    const isComplete = total > 0 && doneCount >= total;

    if(isComplete && !wasComplete){
      // 剛剛達成全部完成：觸發音效與特效，並確保顯示慶祝畫面
      celebrateDismissed = false;
      step1.classList.remove('hidden');
      step2.classList.add('hidden');
      playTeethCompleteMelody();
      burstConfetti();
    }
    wasComplete = isComplete;

    if(isComplete && !celebrateDismissed){
      grid.classList.add('hidden');
      celebrate.classList.remove('hidden');
      return;
    }
    celebrate.classList.add('hidden');
    grid.classList.remove('hidden');

    grid.innerHTML = '';
    for(let n=1; n<=total; n++){
      const brushed = !!todayRecord[n];
      const btn = document.createElement('button');
      btn.className = 'tooth-btn' + (brushed ? ' brushed' : '');
      btn.innerHTML = `
        ${brushed ? '<span class="tooth-star">⭐</span>' : ''}
        <div class="tooth-shape">
          <div class="tooth-emoji">🦷</div>
          <div class="tooth-face">
            <div class="tooth-eyes"><span></span><span></span></div>
            <div class="tooth-mouth"></div>
          </div>
        </div>
        <div class="tooth-caption">${n}號</div>
      `;
      btn.addEventListener('click', () => {
        updateState(s => {
          if(!s.teeth[todayKey()]) s.teeth[todayKey()] = {};
          s.teeth[todayKey()][n] = !s.teeth[todayKey()][n];
        });
        playToothClickSound();
        render();
        // 重新渲染後，對同一顆牙齒補上彈跳動畫
        requestAnimationFrame(() => {
          const refreshed = grid.querySelector(`.tooth-btn:nth-child(${n})`);
          if(refreshed){
            refreshed.classList.add('just-clicked');
            setTimeout(() => refreshed.classList.remove('just-clicked'), 400);
          }
        });
      });
      grid.appendChild(btn);
    }
  }

  card.querySelector('[data-action="back-to-grid"]').addEventListener('click', () => {
    celebrateDismissed = true;
    render();
  });

  totalMinusBtn.addEventListener('click', () => {
    updateState(s => { s.teethTotal = Math.max(1, s.teethTotal - 1); });
    render();
  });
  totalPlusBtn.addEventListener('click', () => {
    updateState(s => { s.teethTotal = Math.min(30, s.teethTotal + 1); });
    render();
  });

  resetTodayBtn.addEventListener('click', () => {
    updateState(s => { s.teeth[todayKey()] = {}; });
    wasComplete = false;
    if(confettiRafId){ cancelAnimationFrame(confettiRafId); confettiRafId = null; }
    render();
    showToast('🔄 今天的刷牙紀錄已重置！');
  });

  nextBtn.addEventListener('click', () => {
    step1.classList.add('hidden');
    step2.classList.remove('hidden');
  });

  render();

  return {
    destroy(){
      if(confettiRafId) cancelAnimationFrame(confettiRafId);
    }
  };
}

const openWindows = new Set(); // 目前存在於畫面上的工具 id
const fakeFullscreenWindows = new Set();
const windowControllers = {}; // 存放各工具視窗的 destroy() 控制器，避免視窗關閉後動畫/計時器繼續跑

function renderSidebarButtons(){
  const wrap = document.getElementById('toolButtons');
  wrap.innerHTML = '';
  TOOLS.forEach(tool => {
    const btn = document.createElement('button');
    btn.id = `sidebar-btn-${tool.id}`;
    btn.className = 'tool-btn';
    btn.style.background = tool.color;
    btn.innerHTML = `<span class="emoji">${tool.emoji}</span><span class="label">${tool.name}</span>`;
    btn.addEventListener('click', () => openTool(tool.id));
    wrap.appendChild(btn);
  });
}

function getToolMeta(id){ return TOOLS.find(t => t.id === id); }

function openTool(id){
  const existing = document.getElementById(`win-${id}`);
  if(existing){
    // 已存在但被縮小 -> 還原，並恢復全螢幕
    existing.classList.remove('hidden');
    removeDockChip(id);
    checkEmptyHint();
    if(!fakeFullscreenWindows.has(id)) enterFakeFullscreen(id);
    return;
  }
  createWindow(id);
  checkEmptyHint();
  enterFakeFullscreen(id); // 點選工具即直接放大到全螢幕
}

function createWindow(id){
  const tool = getToolMeta(id);
  document.getElementById(`sidebar-btn-${id}`).classList.add('is-open');

  const isXL = (id === 'pet' || id === 'score' || id === 'homework' || id === 'teeth');
  const card = document.createElement('div');
  card.className = 'win-card' + (isXL ? ' win-xl' : ' win-lg');
  card.id = `win-${id}`;

  card.innerHTML = `
    <div class="win-header" style="background:${tool.color}">
      <div class="win-header-title">
        <span class="emoji">${tool.emoji}</span>${tool.name}
      </div>
      <div class="win-header-actions">
        <button class="win-header-btn" data-action="min" title="縮小隱藏">➖</button>

        <button class="win-header-btn" data-action="close" title="關閉">✖️</button>
      </div>
    </div>
    ${getToolBodyHtml(id, tool)}
  `;

  card.querySelector('[data-action="min"]').addEventListener('click', () => minimizeWindow(id));
  card.querySelector('[data-action="full"]').addEventListener('click', () => toggleFullscreen(id));
  card.querySelector('[data-action="close"]').addEventListener('click', () => closeWindow(id));

  document.getElementById('workspace').appendChild(card);
  openWindows.add(id);

  // 個別工具的實際邏輯（畫布繪圖、動畫、事件綁定），回傳 destroy() 供關閉視窗時清理
  if(id === 'timer'){
    windowControllers[id] = initTimerTool(card);
  } else if(id === 'draw'){
    windowControllers[id] = initDrawTool(card);
  } else if(id === 'stopwatch'){
    windowControllers[id] = initStopwatchTool(card);
  } else if(id === 'pet'){
    windowControllers[id] = initPetTool(card);
  } else if(id === 'score'){
    windowControllers[id] = initScoreTool(card);
  } else if(id === 'homework'){
    windowControllers[id] = initHomeworkTool(card);
  } else if(id === 'exam'){
    windowControllers[id] = initExamTool(card);
  } else if(id === 'teeth'){
    windowControllers[id] = initTeethTool(card);
  }
}

function minimizeWindow(id){
  const win = document.getElementById(`win-${id}`);
  if(!win) return;
  if(document.fullscreenElement === win) document.exitFullscreen();
  if(fakeFullscreenWindows.has(id)) exitFakeFullscreen(id);
  win.classList.add('hidden');
  addDockChip(id);
  checkEmptyHint();
}

function closeWindow(id){
  const win = document.getElementById(`win-${id}`);
  if(win){
    if(document.fullscreenElement === win) document.exitFullscreen();
    if(fakeFullscreenWindows.has(id)) exitFakeFullscreen(id);
    win.remove();
  }
  if(windowControllers[id]){
    windowControllers[id].destroy();
    delete windowControllers[id];
  }
  removeDockChip(id);
  openWindows.delete(id);
  document.getElementById(`sidebar-btn-${id}`).classList.remove('is-open');
  checkEmptyHint();
}

function toggleFullscreen(id){
  const win = document.getElementById(`win-${id}`);
  if(!win) return;

  if(fakeFullscreenWindows.has(id)){
    exitFakeFullscreen(id);
  } else {
    // 直接使用 CSS 撐滿整個畫面，不依賴瀏覽器原生全螢幕 API
    // （在許多嵌入式/預覽環境中原生 API 會被限制，無法保證真的進入全螢幕）
    enterFakeFullscreen(id);
  }
}

function enterFakeFullscreen(id){
  const win = document.getElementById(`win-${id}`);
  if(!win) return;
  win.classList.add('fake-fullscreen');
  fakeFullscreenWindows.add(id);
  document.addEventListener('keydown', escExitFakeFullscreen);
}

function exitFakeFullscreen(id){
  const win = document.getElementById(`win-${id}`);
  if(win) win.classList.remove('fake-fullscreen');
  fakeFullscreenWindows.delete(id);
  if(fakeFullscreenWindows.size === 0){
    document.removeEventListener('keydown', escExitFakeFullscreen);
  }
}

function escExitFakeFullscreen(e){
  if(e.key === 'Escape'){
    [...fakeFullscreenWindows].forEach(exitFakeFullscreen);
  }
}

function addDockChip(id){
  if(document.getElementById(`dock-chip-${id}`)) return;
  const tool = getToolMeta(id);
  const dock = document.getElementById('dock');
  dock.classList.remove('hidden');
  const chip = document.createElement('button');
  chip.id = `dock-chip-${id}`;
  chip.className = 'dock-chip';
  chip.innerHTML = `<span class="emoji">${tool.emoji}</span><span>${tool.name}</span>`;
  chip.addEventListener('click', () => openTool(id));
  dock.appendChild(chip);
}

function removeDockChip(id){
  const chip = document.getElementById(`dock-chip-${id}`);
  if(chip) chip.remove();
  if(!document.getElementById('dock').children.length){
    document.getElementById('dock').classList.add('hidden');
  }
}

function checkEmptyHint(){
  const workspace = document.getElementById('workspace');
  const anyVisible = [...workspace.querySelectorAll('.win-card')].some(w => !w.classList.contains('hidden'));
  document.getElementById('emptyHint').classList.toggle('hidden', anyVisible);
}

/* ============================================================
   6. 同步 Modal 綁定
   ============================================================ */
function bindSyncModal(){
  const modal = document.getElementById('syncModal');
  document.getElementById('syncBtn').addEventListener('click', () => {
    updateSyncStatus();
    modal.classList.remove('hidden');
  });
  document.getElementById('closeSyncModal').addEventListener('click', () => modal.classList.add('hidden'));
  modal.addEventListener('click', (e) => { if(e.target === modal) modal.classList.add('hidden'); });

  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) importData(file);
  });
}

/* ============================================================
   7. 初始化
   ============================================================ */
function initTopBar(){
  const today = new Date();
  document.getElementById('todayText').innerText =
    today.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
}

function init(){
  loadState();
  renderSidebarButtons();
  bindSyncModal();
  initTopBar();
  updateSyncStatus();
  if(!classState.lastUpdated){
    saveState(); // 第一次進來先建立一份初始資料
  }
}

init();

</script>
