<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌈 班級經營工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FFD9E6;
    --pink-deep:#FF9FBE;
    --blue:#CDEFFB;
    --blue-deep:#8AD8F0;
    --green:#E1F5DC;
    --green-deep:#A8E6A1;
    --cream:#FFFBF3;
    --text:#5C4B51;
    --shadow: 0 10px 24px rgba(92,75,81,0.14);
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; margin:0; }
  body{
    width:100%;
    background:var(--cream);
    color:var(--text);
    font-family:'Baloo 2','PingFang TC','Microsoft JhengHei',sans-serif;
    overflow:hidden;
  }
  .hidden{ display:none !important; }
  button, label{ font-family:inherit; }
  button{ border:none; background:none; padding:0; margin:0; font:inherit; color:inherit; cursor:pointer; }

  /* ---------- App layout ---------- */
  .app-root{ display:flex; height:100vh; width:100vw; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:14rem;
    flex-shrink:0;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:1rem 0.85rem;
    gap:0.5rem;
    border-top-right-radius:2.5rem;
    border-bottom-right-radius:2.5rem;
    background: linear-gradient(180deg, var(--pink) 0%, var(--blue) 55%, var(--green) 100%);
    box-shadow: var(--shadow);
    overflow-y:auto;
  }
  .sidebar-logo{ margin-bottom:0.25rem; text-align:center; flex-shrink:0; }
  .sidebar-logo .emoji{ font-size:2rem; display:block; }
  .sidebar-logo .label{ font-size:1.1rem; font-weight:700; margin-top:0.15rem; }

  .tool-list{ width:100%; display:flex; flex-direction:column; gap:0.5rem; flex-shrink:0; }
  .sidebar-spacer{ flex:1; min-height:0.5rem; }

  .tool-btn{
    width:100%;
    background:#fff;
    border-radius:1rem;
    box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
    border: 3px solid transparent;
    padding:0.25rem 0.3rem;
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:center;
    gap:0.4rem;
    font-weight:700;
    flex-shrink:0;
  }
  .tool-btn .emoji{ font-size:1.1rem; }
  .tool-btn .label{ font-size:1rem; }
  .tool-btn:hover{ transform: translateY(-3px) scale(1.03); }
  .tool-btn:active{ transform: translateY(0) scale(0.98); }
  .tool-btn.is-open{ border-color: var(--pink-deep); }

  .sync-btn{
    width:100%;
    background: repeating-linear-gradient(135deg, #fff, #fff 10px, #FFF6EC 10px, #FFF6EC 20px);
    border: 3px dashed var(--pink-deep);
    border-radius: 1.5rem;
    padding:0.6rem 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0.15rem;
    font-weight:700;
    flex-shrink:0;
  }
  .sync-btn .emoji{ font-size:1.35rem; }

  /* ---------- Mascot ---------- */
  @keyframes floaty{
    0%,100%{ transform: translateY(0) rotate(-2deg); }
    50%{ transform: translateY(-6px) rotate(2deg); }
  }
  .mascot{ animation: floaty 3s ease-in-out infinite; display:inline-block; }

  /* ---------- Main / Topbar ---------- */
  .main-area{ flex:1; height:100%; display:flex; flex-direction:column; position:relative; min-width:0; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:1rem 2rem; }
  .date-text{ font-size:0.875rem; opacity:0.7; font-weight:700; }
  .sync-status{ font-size:0.875rem; font-weight:700; background:#fff; border-radius:9999px; padding:0.5rem 1rem; box-shadow: var(--shadow); }

  .workspace{ flex:1; overflow:auto; padding:0 2rem 1rem; display:flex; flex-wrap:wrap; gap:1.5rem; align-content:flex-start; }

  .empty-hint{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; opacity:0.6; gap:0.75rem; user-select:none; }
  .empty-hint .emoji{ font-size:3.75rem; }
  .empty-hint .text{ font-weight:700; font-size:1.125rem; }

  .dock{ border-top:4px solid #FDE3EC; background:rgba(255,255,255,0.7); backdrop-filter: blur(6px); padding:0.5rem 1rem; display:flex; gap:0.75rem; overflow-x:auto; }

  /* ---------- Windows ---------- */
  .win-card{
    box-shadow: var(--shadow);
    border-radius: 2rem;
    background:#fff;
    border: 4px solid #fff;
    display:flex;
    flex-direction:column;
    width: 340px;
    height: 400px;
    overflow:hidden;
  }
  .win-card:fullscreen,
  .win-card.fake-fullscreen{
    width:100vw; height:100vh; border-radius:0;
  }
  .win-card.fake-fullscreen{
    position: fixed;
    inset: 0;
    z-index: 100;
  }
  .win-card:fullscreen .win-body,
  .win-card.fake-fullscreen .win-body{
    padding: 4rem;
  }
  .win-card:fullscreen .win-body .placeholder-emoji,
  .win-card.fake-fullscreen .win-body .placeholder-emoji{
    font-size: 10rem !important;
  }
  .win-card:fullscreen .win-body .placeholder-text,
  .win-card.fake-fullscreen .win-body .placeholder-text{
    font-size: 2rem !important;
  }

  .win-header{ display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1rem; }
  .win-header-title{ font-weight:700; font-size:1.125rem; display:flex; align-items:center; gap:0.5rem; }
  .win-header-title .emoji{ font-size:1.5rem; }
  .win-header-actions{ display:flex; align-items:center; gap:0.5rem; }

  .win-header-btn{
    width:2.1rem; height:2.1rem;
    display:flex; align-items:center; justify-content:center;
    border-radius:9999px;
    background:rgba(255,255,255,0.7);
    transition: background .15s ease, transform .15s ease;
    font-size:1rem;
  }
  .win-header-btn:hover{ background:#fff; transform: scale(1.08); }

  .win-body{ flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.75rem; padding:1.5rem; text-align:center; }
  .placeholder-emoji{ font-size:4.5rem; }
  .placeholder-text{ font-weight:700; font-size:1.125rem; opacity:0.7; }
  .placeholder-note{ font-size:0.75rem; opacity:0.5; }

  /* ---------- Timer / Draw tool panels ---------- */
  .win-card.win-lg{ width:380px; height:560px; }
  .win-card.win-xl{ width:940px; height:640px; }
  .tool-panel{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; padding:1.1rem; gap:0.7rem; overflow:auto; }
  .tool-canvas-wrap{ position:relative; width:100%; flex:1; min-height:150px; display:flex; align-items:center; justify-content:center; }
  .tool-canvas-wrap canvas{ display:block; width:100%; height:100%; max-width:100%; }

  .mini-btn-row{ display:flex; gap:0.4rem; flex-wrap:wrap; justify-content:center; }
  .mini-btn{
    background:#fff;
    border-radius:0.9rem;
    box-shadow: var(--shadow);
    padding:0.5rem 0.8rem;
    font-weight:700;
    font-size:0.85rem;
    transition: transform .12s ease;
    border:3px solid transparent;
  }
  .mini-btn:hover{ transform: translateY(-2px); }
  .mini-btn:active{ transform: translateY(0) scale(.95); }
  .mini-btn.primary{ background:var(--pink-deep); color:#fff; font-size:0.95rem; padding:0.6rem 1.1rem; }
  .mini-btn:disabled{ opacity:0.5; cursor:default; transform:none; }

  .field-row{ display:flex; align-items:center; gap:0.5rem; font-weight:700; font-size:0.9rem; }
  .field-row input[type=number]{
    width:4rem; padding:0.3rem 0.4rem; border-radius:0.6rem;
    border:2px solid var(--pink-deep); text-align:center;
    font:inherit; font-weight:700; color:var(--text);
  }
  .fields-wrap{ display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; }
  .draw-section-label{ font-size:0.8rem; font-weight:700; opacity:0.55; margin-top:0.15rem; }

  .timer-adjust-row{ display:flex; gap:1.2rem; justify-content:center; flex-shrink:0; }
  .adjust-group{ display:flex; flex-direction:column; align-items:center; gap:0.15rem; }
  .adjust-label{ font-size:0.7rem; font-weight:700; opacity:0.7; }
  .arrow-btn{
    width:1.9rem; height:1.5rem;
    background:#fff; border-radius:0.5rem;
    box-shadow: var(--shadow);
    font-weight:800; font-size:0.85rem;
    display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease;
  }
  .arrow-btn:hover{ transform: translateY(-2px) scale(1.05); }
  .arrow-btn:active{ transform: translateY(0) scale(0.95); }

  .timer-actions.mini-btn-row{ gap:0.5rem; }
  .timer-actions .mini-btn{ padding:0.3rem 0.6rem; font-size:0.85rem; }
  .timer-actions .mini-btn.primary{ padding:0.35rem 0.7rem; font-size:0.9rem; }

  .draw-history, .draw-results{ min-height:2.2rem; width:100%; max-height:4.5rem; overflow-y:auto; }

  /* ---------- 共用：名單/項目設定面板 ---------- */
  .roster-toggle-row{ display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap; flex-shrink:0; }
  .roster-editor{
    width:100%; display:flex; flex-direction:column; gap:0.5rem;
    background:#FFF8EF; border-radius:1rem; padding:0.75rem; flex-shrink:0;
  }
  .roster-editor label{ font-size:0.8rem; font-weight:700; opacity:0.75; }
  .roster-editor textarea{
    width:100%; min-height:4.5rem; border-radius:0.7rem; border:2px solid #EFE3D3;
    padding:0.5rem; font-family:inherit; font-size:0.85rem; resize:vertical; color:var(--text);
  }
  .roster-editor .hint{ font-size:0.7rem; opacity:0.55; }

  /* ---------- 表現計分器 ---------- */
  .score-card .crown{ position:absolute; top:0.1rem; right:0.1rem; font-size:0.85rem; line-height:1; }
  .score-tabs button{
    flex:1; padding:0.5rem; border-radius:1rem; background:#fff; font-weight:700;
    box-shadow: var(--shadow); opacity:0.55; white-space:nowrap;
  }
  .score-tabs button.active{ opacity:1; background:var(--green); }
  .score-panel{ align-items:stretch; }
  .score-topbar{ display:flex; align-items:center; gap:0.5rem; width:100%; flex-wrap:wrap; justify-content:space-between; flex-shrink:0; }
  .score-tabs{ display:flex; gap:0.4rem; flex-shrink:0; }
  .score-controls{ display:flex; gap:0.3rem; flex-wrap:wrap; }
  .score-controls .mini-btn{ font-size:0.68rem; padding:0.28rem 0.5rem; }
  .score-roster-toggle{ flex-shrink:0; }
  #win-score:fullscreen .score-roster-toggle,
  #win-score.fake-fullscreen .score-roster-toggle{ display:none; }

  .score-layout{ display:flex; gap:0.7rem; width:100%; flex:1; min-height:0; }

  .score-podium-wrap{
    width:15.5rem; flex-shrink:0; display:flex; flex-direction:column; gap:0.5rem;
    background:var(--blue); border-radius:1.2rem; padding:0.7rem 0.5rem; position:relative;
  }
  .score-podium{ flex:1; overflow-y:auto; }
  .podium-confetti-canvas{ position:absolute; inset:0; pointer-events:none; border-radius:1.2rem; }
  .accumulate-btn{ font-size:0.72rem; padding:0.4rem 0.3rem; width:100%; }
  .score-podium:empty{ display:none; }
  .podium-title{ font-size:0.78rem; font-weight:800; text-align:center; margin-bottom:0.4rem; }
  .podium-list{ display:flex; flex-direction:column; gap:0.3rem; }
  .podium-row{
    display:flex; align-items:center; gap:0.4rem;
    background:#FFF8EF; border-radius:0.8rem; padding:0.5rem 0.6rem;
    font-weight:800; font-size:1.05rem;
  }
  .podium-row.rank-1{ background:#FFF3C4; }
  .podium-row.rank-2{ background:#F0F0F0; }
  .podium-row.rank-3{ background:#FBE3CB; }
  .podium-medal{ font-size:1.4rem; width:1.6rem; text-align:center; flex-shrink:0; }
  .podium-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .podium-score{ color:var(--pink-deep); font-weight:800; flex-shrink:0; }

  @keyframes podiumPop{
    0%{ opacity:0; transform: translateY(16px) scale(0.8); }
    60%{ opacity:1; transform: translateY(-4px) scale(1.06); }
    100%{ opacity:1; transform: translateY(0) scale(1); }
  }
  .podium-list.reveal .podium-row{ opacity:0; animation: podiumPop 0.5s ease forwards; }
  .podium-row.rank-1, .podium-row.rank-2, .podium-row.rank-3{ position:relative; overflow:hidden; }
  .podium-list.reveal .podium-row.rank-1::after,
  .podium-list.reveal .podium-row.rank-2::after,
  .podium-list.reveal .podium-row.rank-3::after{
    content:''; position:absolute; top:0; left:-60%; width:35%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.85), transparent);
    animation: shineSweep 1.1s ease-in-out 0.5s 2;
  }
  @keyframes shineSweep{
    0%{ left:-60%; }
    100%{ left:130%; }
  }

  .score-grid{
    flex:1; min-width:0; overflow-y:auto;
    display:flex; flex-wrap:wrap; gap:0.7rem; align-content:flex-start; justify-content:center;
    padding:0.2rem;
  }
  .score-grid.grid-10col{
    display:grid; grid-template-columns:repeat(10, 1fr); gap:0.4rem;
  }
  .score-grid.grid-10col .score-card{ width:auto; }
  .score-card{
    position:relative;
    width:6.4rem; background:#fff; border-radius:1.1rem; box-shadow:var(--shadow);
    padding:0.35rem 0.4rem; display:flex; flex-direction:column; align-items:center; gap:0.2rem;
    overflow:visible;
  }
  .score-card .name{ font-weight:800; font-size:1.05rem; text-align:center; line-height:1.2; }
  .score-card .value{ font-weight:800; font-size:3.1rem; color:var(--pink-deep); line-height:1; }
  .score-card .btn-row{ display:flex; gap:0.4rem; }
  .score-card button{
    width:1.8rem; height:1.8rem; border-radius:9999px; background:#F5F0EA; font-weight:800; font-size:1rem;
  }
  .score-card button.plus{ background:var(--green); }
  .score-card button.minus{ background:var(--pink); }

  .score-grid.group-mode{
    display:flex; flex-wrap:wrap; gap:1rem; justify-content:center; align-content:flex-start;
  }
  .score-grid.group-mode .score-card{
    width:13rem; padding:1.4rem 1rem;
  }
  .score-grid.group-mode .score-card .name{ font-size:1.5rem; }
  .score-grid.group-mode .score-card .value{ font-size:3.2rem; }
  .score-grid.group-mode .score-card button{ width:2.6rem; height:2.6rem; font-size:1.4rem; }
  .score-grid.group-mode .score-card .crown{ font-size:1.3rem; }
  .score-card canvas.burst-canvas{
    position:absolute; left:50%; top:-1.2rem; transform:translateX(-50%);
    width:6.4rem; height:5rem; pointer-events:none;
  }

  /* ---------- 作業追蹤器 ---------- */
  .homework-panel{ align-items:stretch; padding-left:0.4rem; padding-right:0.4rem; }
  #win-homework.win-xl:fullscreen .win-body,
  #win-homework.win-xl.fake-fullscreen .win-body{ padding-left:0.6rem; padding-right:0.6rem; }
  .homework-topbar{
    display:flex; gap:0.35rem; flex-wrap:wrap; justify-content:center; flex-shrink:0;
  }
  .homework-topbar .mini-btn{ font-size:0.85rem; padding:0.2rem 0.55rem; }

  .homework-zones{ flex:1; width:100%; display:flex; gap:0.6rem; overflow:auto; align-items:flex-start; }
  .homework-zone-table{
    border-collapse:collapse; font-size:0.85rem; table-layout:fixed;
    flex:1 1 0; width:100%; min-width:0;
  }
  .homework-zone-table th:first-child, .homework-zone-table td:first-child{ width:5.8rem; }
  .homework-zone-table td.name-cell{ overflow:hidden; text-overflow:ellipsis; }
  .homework-zone-table th, .homework-zone-table td{
    border:2px solid #A8946E; padding:0.42rem 0.35rem; text-align:center; white-space:nowrap;
    font-size:0.98rem;
  }
  .homework-zone-table th{ background:#FFF3E2; font-weight:700; position:sticky; top:0; }
  .homework-zone-table th.item-header{ cursor:pointer; }
  .homework-zone-table th.item-header:hover{ background:#FFE3B8; }
  .homework-zone-table td.name-cell{ text-align:center; font-weight:800; font-size:1.05rem; background:#FFFDF9; position:sticky; left:0; }
  .homework-cell{ cursor:pointer; font-size:1.15rem; user-select:none; }
  .homework-cell.done{ background:#E8F6E3; }
  .homework-cell.undone{ background:#FDEAEA; }
  .homework-cell.empty{ opacity:0.3; }

  /* ---------- 考試計時器 ---------- */
  .exam-panel{ align-items:stretch; }
  .exam-header-row{
    display:flex; align-items:flex-start; justify-content:space-between; gap:0.6rem;
    width:100%; flex-wrap:wrap; flex-shrink:0;
  }
  .exam-attendance{
    display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap;
    font-size:1.05rem; font-weight:800;
  }
  .exam-attendance label{ display:flex; align-items:center; gap:0.3rem; }
  .exam-attendance input[type=number]{
    width:3.4rem; padding:0.3rem 0.4rem; border-radius:0.6rem; border:2px solid #E8D9C5;
    font-family:inherit; font-weight:800; font-size:1.05rem; text-align:center;
  }
  .exam-absent-display{ color:var(--pink-deep); }
  .exam-toggle-row{ display:flex; gap:0.3rem; flex-shrink:0; }
  .exam-toggle-row .mini-btn{ font-size:0.95rem; padding:0.3rem 0.5rem; opacity:0.5; }
  .exam-toggle-row .mini-btn.active{ opacity:1; background:var(--green); }
  .exam-time-range-row{
    display:flex; align-items:center; justify-content:center; gap:0.4rem;
    font-size:0.8rem; font-weight:700; flex-shrink:0; opacity:0.85;
  }
  .exam-time-range-row input[type=time]{
    border-radius:0.6rem; border:2px solid #EFE3D3; padding:0.25rem 0.45rem;
    font-family:inherit; font-weight:700; font-size:0.85rem; color:var(--text);
  }
  .exam-canvas-wrap{ position:relative; width:100%; flex:1; min-height:120px; border-radius:1rem; overflow:hidden; transition: background-color .4s ease; }
  .exam-canvas-wrap canvas{ display:block; width:100%; height:100%; }
  .exam-canvas-wrap.warn-yellow{ background:#FFE9A8; }
  .exam-canvas-wrap.warning{ background:#FFB0A0; }

  /* ---------- 潔牙完成表 ---------- */
  .teeth-panel{ gap:0.5rem; position:relative; }
  .teeth-header{ display:flex; align-items:center; justify-content:space-between; gap:0.5rem; flex-wrap:wrap; flex-shrink:0; width:100%; }
  .teeth-header .teeth-date{ font-size:0.75rem; font-weight:700; opacity:0.6; }
  .teeth-header-right{ display:flex; align-items:center; gap:0.35rem; }
  .teeth-total-control{ display:flex; align-items:center; gap:0.25rem; font-weight:700; font-size:0.7rem; }
  .teeth-total-control label{ opacity:0.6; }
  .teeth-total-control .mini-btn{ padding:0.15rem 0.4rem; font-size:0.72rem; }
  .teeth-header-right .mini-btn{ padding:0.15rem 0.4rem; font-size:0.72rem; }
  .teeth-total-value{ min-width:1.4rem; text-align:center; font-size:0.72rem; }

  .teeth-main{ flex:1; width:100%; position:relative; overflow:hidden; }
  .teeth-grid{
    height:100%; overflow-y:auto; width:100%;
    display:grid; grid-template-columns:repeat(10, 1fr); gap:0.5rem;
    padding:0.2rem; align-content:flex-start;
  }
  .tooth-btn{
    background:#F6F6F4; box-shadow:none; border:0.15rem solid #C9C9C2;
    border-radius:1.2rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; transition: transform .12s ease, background .25s ease, border-color .25s ease;
    padding:0.5rem 0.2rem 0.4rem;
    gap:0.2rem;
  }
  .tooth-btn.brushed{
    background:#FFF6D9; border-color:#FFD966; box-shadow:var(--shadow);
  }
  .tooth-btn:hover{ transform: translateY(-3px) scale(1.04); }
  .tooth-btn:active{ transform: translateY(0) scale(0.96); }
  .tooth-btn.just-clicked{ animation: toothPop 0.35s ease; }
  @keyframes toothPop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.18) rotate(-4deg); }
    70%{ transform: scale(0.94) rotate(3deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  .tooth-btn .tooth-shape{
    width:2.8rem; height:3.2rem;
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .tooth-btn .tooth-emoji{
    font-size:2.9rem; line-height:1;
    filter: grayscale(0.6) brightness(0.9);
    transition: filter .25s ease;
  }
  .tooth-btn.brushed .tooth-emoji{ filter:none; }
  .tooth-btn .tooth-face{
    position:absolute; top:38%; left:50%; transform:translate(-50%, -50%);
    display:flex; flex-direction:column; align-items:center; gap:0.14rem;
    width:1.6rem;
  }
  .tooth-btn .tooth-eyes{ display:flex; justify-content:center; gap:0.4rem; }
  .tooth-btn .tooth-eyes span{
    width:0.22rem; height:0.22rem; border-radius:50%; background:#4A4A4A; display:block; flex-shrink:0;
  }
  .tooth-btn .tooth-mouth{
    width:0.4rem; height:0.2rem;
    border:0.075rem solid #4A4A4A; border-bottom:none;
    border-radius:0.4rem 0.4rem 0 0;
    margin-top:0.06rem;
  }
  .tooth-btn.brushed .tooth-mouth{
    border:0.075rem solid #4A4A4A; border-top:none; border-bottom:0.075rem solid #4A4A4A;
    border-radius:0 0 0.4rem 0.4rem;
  }
  .tooth-btn .tooth-caption{ font-size:1.05rem; font-weight:800; opacity:0.65; }
  .tooth-btn.brushed .tooth-caption{ color:#4CAF50; opacity:0.95; }
  .tooth-btn .tooth-star{
    position:absolute; top:0.3rem; left:0.35rem; font-size:0.85rem;
    animation: sparkleTwinkle 1.4s ease-in-out infinite;
  }
  @keyframes sparkleTwinkle{
    0%,100%{ opacity:0.5; transform:scale(0.85) rotate(0deg); }
    50%{ opacity:1; transform:scale(1.15) rotate(15deg); }
  }

  .teeth-celebrate{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0.5rem;
    background:linear-gradient(160deg, #FFF9EC 0%, #FFE9F1 50%, #EAF6FF 100%);
    border-radius:1rem; overflow:hidden; z-index:10;
  }
  .teeth-celebrate canvas.confetti-canvas{ position:absolute; inset:0; pointer-events:none; }
  .celebrate-back-btn{
    position:absolute; top:0.6rem; right:0.6rem; z-index:2;
    font-size:0.75rem; padding:0.35rem 0.6rem;
  }
  .celebrate-step1, .celebrate-step2{
    display:flex; flex-direction:column; align-items:center; gap:0.6rem; z-index:1; width:100%;
  }
  .celebrate-emoji{ font-size:3.6rem; animation: floaty 1.6s ease-in-out infinite; }
  .celebrate-title{ font-weight:800; font-size:1.6rem; color:var(--pink-deep); text-align:center; }
  .celebrate-desc{ font-weight:700; font-size:1.05rem; text-align:center; line-height:1.6; opacity:0.85; }
  .celebrate-next-btn{ font-size:1.2rem; padding:0.8rem 1.6rem; margin-top:0.4rem; }
  .reminder-title{ font-weight:900; font-size:3rem; margin-top:0.2rem; color:var(--pink-deep); }
  .reminder-list{ display:flex; flex-direction:column; gap:0.6rem; width:88%; max-width:30rem; }
  .reminder-item{
    background:#fff; border-radius:1.1rem; padding:1.1rem 1.2rem; font-weight:800; font-size:2.3rem;
    box-shadow:var(--shadow); text-align:center; border:3px solid var(--pink-deep);
  }
  .draw-history .mini-btn{ background:#F0EEEC; color:var(--text); opacity:0.85; box-shadow:none; }

  .win-card:fullscreen .mini-btn,
  .win-card.fake-fullscreen .mini-btn{ font-size:1.15rem; padding:0.7rem 1.1rem; }
  .win-card:fullscreen .mini-btn.primary,
  .win-card.fake-fullscreen .mini-btn.primary{ font-size:1.3rem; padding:0.85rem 1.4rem; }

  /* ---------- Dock chip ---------- */
  .dock-chip{
    background:#fff;
    border-radius:9999px;
    box-shadow: var(--shadow);
    transition: transform .15s ease;
    padding:0.5rem 1rem;
    display:flex;
    align-items:center;
    gap:0.5rem;
    font-weight:700;
    flex-shrink:0;
  }
  .dock-chip .emoji{ font-size:1.25rem; }
  .dock-chip:hover{ transform: translateY(-3px); }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:1.5rem; right:1.5rem;
    background:#fff; color:var(--text);
    padding:0.75rem 1.25rem; border-radius:9999px;
    box-shadow: var(--shadow);
    font-weight:700;
    opacity:0; transform: translateY(10px);
    transition: opacity .25s ease, transform .25s ease;
    z-index: 200;
    pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateY(0); }

  /* ---------- Sync modal ---------- */
  .modal-mask{
    position:fixed; inset:0; background:rgba(92,75,81,0.35);
    display:flex; align-items:center; justify-content:center; z-index:150;
  }
  .sync-modal-box{
    background:#fff;
    border-radius:2rem;
    box-shadow: 0 20px 45px rgba(92,75,81,0.25);
    padding:2rem;
    width:26rem;
    max-width:90vw;
    position:relative;
  }
  .modal-close-btn{ position:absolute; top:1rem; right:1rem; }
  .sync-modal-header{ text-align:center; margin-bottom:1rem; }
  .sync-modal-header .emoji{ font-size:3rem; }
  .sync-modal-header .title{ font-size:1.5rem; font-weight:700; margin-top:0.5rem; }
  .sync-modal-header .desc{ font-size:0.875rem; opacity:0.7; margin-top:0.25rem; font-weight:700; }
  .sync-modal-actions{ display:flex; flex-direction:column; gap:0.75rem; margin-top:1.5rem; }
  .sync-modal-actions .tool-btn{ flex-direction:row; justify-content:center; padding:1rem; font-size:1.125rem; gap:0.5rem; cursor:pointer; }
  .last-sync-text{ font-size:0.75rem; text-align:center; opacity:0.6; margin-top:1.25rem; font-weight:700; }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background: var(--pink-deep); border-radius:9999px; }
  ::-webkit-scrollbar-track{ background: transparent; }

<body>

<div class="app-root">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="emoji mascot">🏫</span>
      <div class="label">班級工具箱</div>
    </div>

    <div id="toolButtons" class="tool-list"></div>

    <div class="sidebar-spacer"></div>

    <button id="syncBtn" class="sync-btn">
      <span class="emoji">☁️🔄</span>
      <span>同步與備份</span>
    </button>
  </aside>

  <!-- ============ Main ============ -->
  <main class="main-area">
    <!-- Top bar -->
    <header class="topbar">
      <div>
        <div id="todayText" class="date-text"></div>
      </div>
      <div id="syncStatus" class="sync-status">
        💾 尚未儲存
      </div>
    </header>

    <!-- Workspace -->
    <section id="workspace" class="workspace">
      <div id="emptyHint" class="empty-hint">
        <div class="emoji">🧸</div>
        <div class="text">點選左邊的工具，打開你的第一個小卡片吧！</div>
      </div>
    </section>

    <!-- Dock for minimized windows -->
    <div id="dock" class="dock hidden"></div>
  </main>
</div>

<!-- ============ Sync Modal ============ -->
<div id="syncModal" class="modal-mask hidden">
  <div class="sync-modal-box">
    <button id="closeSyncModal" class="win-header-btn modal-close-btn">✖️</button>
    <div class="sync-modal-header">
      <div class="emoji">☁️</div>
      <div class="title">同步與備份</div>
      <div class="desc">在學校匯出，回家匯入，資料就跟著你走～</div>
    </div>
    <div class="sync-modal-actions">
      <button id="exportBtn" class="tool-btn" style="background:var(--blue)">
        ⬇️ 匯出資料（下載 .json）
      </button>
      <label class="tool-btn" style="background:var(--pink)">
        ⬆️ 匯入資料（上傳 .json）
        <input id="importInput" type="file" accept="application/json" class="hidden">
      </label>
    </div>
    <div id="lastSyncText" class="last-sync-text"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>

/* ============================================================
   1. 全域資料狀態 classState + LocalStorage 同步
   ============================================================ */
const STORAGE_KEY = 'classroomToolboxState_v1';

let classState = {
  className: '我的班級',
  students: [
    { seat: 1, name: '小明' },
    { seat: 2, name: '小華' },
    { seat: 3, name: '小美' },
    { seat: 4, name: '小強' },
    { seat: 5, name: '小芳' }
  ],
  groups: ['第1組', '第2組', '第3組'],
  scores: { individual: {}, group: {} },       // key: 座號(字串) 或 小組名稱 -> 本輪分數
  scoreHistory: { individual: {}, group: {} }, // key: 同上 -> 累計總分（按「記錄歷史」才會累加）
  homeworkItems: ['回家作業'],
  homeworkRecords: {},                        // key: "座號-項目索引" -> true(已訂正) / false(未訂正)
  examStartTime: '08:40',      // 考試開始時間 HH:MM
  examEndTime: '09:20',        // 考試結束時間 HH:MM
  examExpected: 30,
  examPresent: 30,
  examWarningEnabled: true,    // 三段式變色警示 開關
  examChimeEnabled: true,      // 自動學校鐘聲 開關
  examDisplayMode: 'track',    // 'track'（智慧考試追蹤／烏龜賽跑）或 'clock'（標準時鐘）
  teethTotal: 25,              // 潔牙表右方號碼區的總人數（1~30）
  teeth: {},                                  // { 'YYYY-MM-DD': { 號碼: true } }
  lastUpdated: null
};

// 名單可能是舊格式（純字串陣列），統一轉換成 {seat, name} 物件陣列
function normalizeStudents(){
  if(!Array.isArray(classState.students)) classState.students = [];
  classState.students = classState.students.map((s, i) => {
    if(typeof s === 'string') return { seat: i+1, name: s };
    return { seat: s.seat != null ? s.seat : i+1, name: s.name || '' };
  });
}

// 確保匯入的舊資料或缺漏欄位不會讓新工具壞掉
function ensureShape(){
  if(!classState.scores || typeof classState.scores !== 'object' || Array.isArray(classState.scores)){
    classState.scores = { individual:{}, group:{} };
  }
  if(!classState.scores.individual) classState.scores.individual = {};
  if(!classState.scores.group) classState.scores.group = {};
  if(!classState.scoreHistory || typeof classState.scoreHistory !== 'object' || Array.isArray(classState.scoreHistory)){
    classState.scoreHistory = { individual:{}, group:{} };
  }
  if(!classState.scoreHistory.individual) classState.scoreHistory.individual = {};
  if(!classState.scoreHistory.group) classState.scoreHistory.group = {};
  if(!Array.isArray(classState.groups) || classState.groups.length === 0) classState.groups = ['第1組', '第2組', '第3組'];
  if(!Array.isArray(classState.homeworkItems) || classState.homeworkItems.length === 0) classState.homeworkItems = ['回家作業'];
  if(!classState.homeworkRecords || typeof classState.homeworkRecords !== 'object') classState.homeworkRecords = {};
  if(typeof classState.examStartTime !== 'string') classState.examStartTime = '08:40';
  if(typeof classState.examEndTime !== 'string') classState.examEndTime = '09:20';
  if(typeof classState.examExpected !== 'number') classState.examExpected = 30;
  if(typeof classState.examPresent !== 'number') classState.examPresent = classState.examExpected;
  if(typeof classState.examWarningEnabled !== 'boolean') classState.examWarningEnabled = true;
  if(typeof classState.examChimeEnabled !== 'boolean') classState.examChimeEnabled = true;
  if(classState.examDisplayMode !== 'track' && classState.examDisplayMode !== 'clock') classState.examDisplayMode = 'track';
  if(!classState.teethTotal || classState.teethTotal < 1) classState.teethTotal = 25;
  if(classState.teethTotal > 30) classState.teethTotal = 30;
  if(!classState.teeth || typeof classState.teeth !== 'object') classState.teeth = {};
  normalizeStudents();
}

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      classState = Object.assign({}, classState, JSON.parse(raw));
    }
  }catch(e){
    console.error('讀取本機資料失敗', e);
  }
  ensureShape();
}

function saveState(){
  classState.lastUpdated = new Date().toISOString();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(classState));
    updateSyncStatus();
    showToast('💾 已自動儲存！');
  }catch(e){
    console.error('儲存本機資料失敗', e);
    showToast('⚠️ 儲存失敗，請檢查瀏覽器設定');
  }
}

// 之後各個工具（倒數計時／抽籤／加分…）都可以呼叫這個函式來改資料，
// 例如：updateState(s => { s.scores['小明'] = (s.scores['小明']||0) + 1; });
function updateState(mutatorFn){
  mutatorFn(classState);
  saveState();
}

function formatDateTime(iso){
  if(!iso) return '尚未同步過';
  const d = new Date(iso);
  return d.toLocaleString('zh-TW', { hour12:false });
}

function updateSyncStatus(){
  document.getElementById('syncStatus').innerHTML = classState.lastUpdated
    ? `✅ 已儲存 ${formatDateTime(classState.lastUpdated).slice(5)}`
    : '💾 尚未儲存';
  document.getElementById('lastSyncText').innerText =
    '上次更新時間：' + formatDateTime(classState.lastUpdated);
}

/* ============================================================
   2. 匯出 / 匯入 JSON
   ============================================================ */
function exportData(){
  const dateStr = new Date().toISOString().slice(0,10);
  
  // 收集班級寵物資料
  const petConfigRaw = localStorage.getItem('classPetConfig');
  const petClassesData = {};
  if (petConfigRaw) {
    try {
      const config = JSON.parse(petConfigRaw);
      if (config && Array.isArray(config.classes)) {
        config.classes.forEach(c => {
          const classData = localStorage.getItem(`classPetData_${c.id}`);
          if (classData) {
            try {
              petClassesData[c.id] = JSON.parse(classData);
            } catch(e) {}
          }
        });
      }
    } catch(e) {}
  }

  const combinedData = {
    type: 'classroom_toolbox_combined_backup',
    version: '2.0',
    classState: classState,
    petData: {
      config: petConfigRaw ? JSON.parse(petConfigRaw) : null,
      classes: petClassesData,
      geminiApiKey: localStorage.getItem('class_pet_gemini_api_key') || '',
      muted: localStorage.getItem('classPetMuted') === 'true'
    }
  };

  const blob = new Blob([JSON.stringify(combinedData, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `班級工具箱全備份_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('⬇️ 全功能備份資料已匯出！');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      const data = JSON.parse(e.target.result);
      
      if (data && data.type === 'classroom_toolbox_combined_backup') {
        // 1. 恢復主工具狀態
        classState = data.classState;
        ensureShape();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(classState));
        
        // 2. 恢復班級寵物狀態
        if (data.petData) {
          const petData = data.petData;
          if (petData.config) {
            localStorage.setItem('classPetConfig', JSON.stringify(petData.config));
          }
          if (petData.classes) {
            Object.keys(petData.classes).forEach(classId => {
              localStorage.setItem(`classPetData_${classId}`, JSON.stringify(petData.classes[classId]));
            });
          }
          if (petData.geminiApiKey) {
            localStorage.setItem('class_pet_gemini_api_key', petData.geminiApiKey);
          }
          if (petData.muted !== undefined) {
            localStorage.setItem('classPetMuted', String(petData.muted));
          }
        }
        showToast('⬆️ 一鍵還原全備份成功，畫面即將重新整理…');
      } else {
        // 舊版或單一工具箱匯入
        classState = data;
        ensureShape();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(classState));
        showToast('⬆️ 匯入班級資料成功，畫面即將重新整理…');
      }
      
      setTimeout(()=> location.reload(), 700);
    }catch(err){
      console.error(err);
      showToast('⚠️ 檔案格式不對喔，請確認是本工具匯出的 .json');
    }
  };
  reader.readAsText(file);
}

   4.5 共用小工具：畫五角星、圓角矩形
   ============================================================ */
function drawStarShape(ctx, cx, cy, spikes, outerR, innerR){
  let rot = Math.PI/2*3;
  const step = Math.PI/spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for(let i=0;i<spikes;i++){
    ctx.lineTo(cx + Math.cos(rot)*outerR, cy + Math.sin(rot)*outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot)*innerR, cy + Math.sin(rot)*innerR);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
}

function drawRoundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function setupHiDPICanvas(canvas, wrap){
  const rect = wrap.getBoundingClientRect();
  const cssW = Math.max(1, rect.width);
  const cssH = Math.max(1, rect.height);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, cssW, cssH };
}

function playCelebrationSound(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    const beepFreq = 1000;
    const beepDur = 0.11;
    const gapDur = 0.07;
    const groupGapDur = 0.28;
    let t = now;
    for(let group = 0; group < 2; group++){
      for(let i = 0; i < 4; i++){
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = beepFreq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.22, t + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + beepDur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + beepDur + 0.02);
        t += beepDur + gapDur;
      }
      t += groupGapDur;
    }
    setTimeout(() => audioCtx.close().catch(()=>{}), 2200);
  }catch(e){
    console.warn('無法播放提示音效', e);
  }
}

function playWestminsterChime(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    // 西敏寺鐘聲真實音高（E大調）：1=G#4 2=F#4 3=E4 4=B3
    const BELL = { 1: 415.30, 2: 369.99, 3: 329.63, 4: 246.94 };
    // 整點報時的完整版本（II, III, IV, V 四組）
    const sequences = [
      [3,1,2,4],
      [3,2,1,3],
      [1,3,2,4],
      [4,2,1,3]
    ];
    let t = now;
    sequences.forEach(seq => {
      seq.forEach((bellNum, i) => {
        const isLast = (i === seq.length - 1);
        const dur = isLast ? 1.3 : 0.55; // 三個短音 + 一個拉長的音（三連音+附點二分音符）
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = BELL[bellNum];
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.3, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur + 0.05);
        t += isLast ? dur + 0.35 : 0.55;
      });
    });
    setTimeout(() => audioCtx.close().catch(()=>{}), (t - now) * 1000 + 800);
  }catch(e){
    console.warn('無法播放鐘聲', e);
  }
}

function playRevealChime(){
  try{
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if(!AudioCtx) return;
    const audioCtx = new AudioCtx();
    const now = audioCtx.currentTime;
    [880, 1318.5].forEach((freq, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = now + i*0.09;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.35);
    });
    setTimeout(() => audioCtx.close().catch(()=>{}), 600);
  }catch(e){ /* 忽略 */ }
}
function initTimerTool(card){
  const canvas = card.querySelector('.tool-canvas');
  const wrap = card.querySelector('.tool-canvas-wrap');
  const startBtn = card.querySelector('[data-action="startpause"]');

  let ctx, cssW = 0, cssH = 0;
  let totalSeconds = 60;
  let remainingSeconds = 60;
  let running = false;
  let startTs = 0;
  let rafId = null;
  let particles = [];
  let celebrating = false;
  let lastDingSecond = null;

  function setupCanvas(){
    const r = setupHiDPICanvas(canvas, wrap);
    ctx = r.ctx; cssW = r.cssW; cssH = r.cssH;
  }

  function fmt(s){
    s = Math.max(0, Math.ceil(s));
    const m = Math.floor(s/60), sec = s%60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function drawBear(fraction){
    const cx = cssW/2, cy = cssH*0.38;
    const r = Math.max(18, Math.min(cssW, cssH) * 0.24);
    const ringR = r + Math.max(8, r*0.22);

    ctx.lineWidth = Math.max(6, r*0.16);
    ctx.strokeStyle = '#FFE6EF';
    ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI*2); ctx.stroke();

    ctx.strokeStyle = fraction > 0.2 ? '#8AD8F0' : '#FF9FBE';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, -Math.PI/2, -Math.PI/2 + Math.PI*2*fraction);
    ctx.stroke();
    ctx.lineCap = 'butt';

    if(fraction > 0){
      const ang = -Math.PI/2 + Math.PI*2*fraction;
      ctx.strokeStyle = '#5C4B51';
      ctx.lineWidth = Math.max(2, r*0.05);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang)*ringR, cy + Math.sin(ang)*ringR);
      ctx.stroke();
    }

    ctx.fillStyle = '#D9A066';
    ctx.beginPath(); ctx.arc(cx-r*0.75, cy-r*0.75, r*0.32, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.75, cy-r*0.75, r*0.32, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#F6D3A6';
    ctx.beginPath(); ctx.arc(cx-r*0.75, cy-r*0.75, r*0.16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.75, cy-r*0.75, r*0.16, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#EFC38A';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#C98A4B'; ctx.lineWidth = Math.max(2, r*0.08); ctx.stroke();

    // 最後 5 秒：讓臉緩慢閃爍變色，提醒時間快到了（改用更醒目的橘紅色）
    if(remainingSeconds > 0 && remainingSeconds <= 5){
      const pulse = (Math.sin(performance.now()/220) + 1) / 2; // 0~1 緩慢脈動
      ctx.globalAlpha = 0.35 + pulse*0.45;
      ctx.fillStyle = '#FF5A3C';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.fillStyle = '#FBE7C8';
    ctx.beginPath(); ctx.ellipse(cx, cy+r*0.3, r*0.44, r*0.32, 0, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#5C4B51';
    ctx.beginPath(); ctx.arc(cx-r*0.32, cy-r*0.05, r*0.09, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.32, cy-r*0.05, r*0.09, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy+r*0.24, r*0.1, 0, Math.PI*2); ctx.fill();

    ctx.lineWidth = Math.max(1.5, r*0.05);
    ctx.beginPath();
    ctx.moveTo(cx, cy+r*0.32);
    ctx.quadraticCurveTo(cx-r*0.14, cy+r*0.46, cx-r*0.24, cy+r*0.36);
    ctx.moveTo(cx, cy+r*0.32);
    ctx.quadraticCurveTo(cx+r*0.14, cy+r*0.46, cx+r*0.24, cy+r*0.36);
    ctx.stroke();

    // 數字時鐘（放在小熊下方，字放大並確保不超出畫布）
    const fontSize = Math.max(34, r*1.15);
    const textY = Math.min(cssH - fontSize*0.6, cy + ringR + Math.max(34, r*0.75));
    ctx.fillStyle = '#5C4B51';
    ctx.font = `800 ${fontSize}px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(fmt(remainingSeconds), cx, textY);
  }

  function spawnParticles(){
    particles = [];
    const cx = cssW/2, cy = cssH*0.38;
    const colors = ['#FF9FBE','#8AD8F0','#A8E6A1','#FFD166','#C792EA'];
    for(let i=0;i<90;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 2 + Math.random()*6;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed - 3,
        rotation: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.3,
        color: colors[Math.floor(Math.random()*colors.length)],
        shape: Math.random() < 0.5 ? 'star' : 'rect',
        size: 8 + Math.random()*10,
        life: 90 + Math.random()*40,
        maxLife: 130
      });
    }
  }

  function drawParticles(){
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.16; p.rotation += p.vr; p.life -= 1;
    });
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      const alpha = Math.max(0, p.life/p.maxLife);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      if(p.shape === 'star'){
        drawStarShape(ctx, 0, 0, 5, p.size, p.size*0.45);
        ctx.fill();
      } else {
        ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      }
      ctx.restore();
    });
    ctx.globalAlpha = 1;
    if(particles.length === 0) celebrating = false;
  }

  function triggerCelebration(){
    celebrating = true;
    spawnParticles();
    playCelebrationSound();
  }

  function render(){
    ctx.clearRect(0, 0, cssW, cssH);
    drawBear(totalSeconds > 0 ? remainingSeconds/totalSeconds : 0);
    if(celebrating) drawParticles();
  }

  function loop(){
    if(running){
      const elapsed = (Date.now() - startTs)/1000;
      remainingSeconds = Math.max(0, totalSeconds - elapsed);

      const secondMark = Math.ceil(remainingSeconds);
      if(secondMark <= 5 && secondMark >= 1 && secondMark !== lastDingSecond){
        lastDingSecond = secondMark;
        playCountdownDing();
      }

      if(remainingSeconds <= 0){
        remainingSeconds = 0;
        running = false;
        lastDingSecond = null;
        startBtn.textContent = '▶️ 開始';
        triggerCelebration();
      }
    } else {
      lastDingSecond = null;
    }
    render();
    rafId = requestAnimationFrame(loop);
  }

  card.querySelectorAll('[data-delta]').forEach(btn => {
    btn.addEventListener('click', () => {
      const delta = parseInt(btn.dataset.delta, 10);
      remainingSeconds = Math.min(3599, Math.max(0, remainingSeconds + delta));
      totalSeconds = Math.max(totalSeconds, remainingSeconds, 1);
      if(running){
        startTs = Date.now() - (totalSeconds - remainingSeconds)*1000;
      }
    });
  });

  startBtn.addEventListener('click', () => {
    if(celebrating){ celebrating = false; particles = []; }
    if(!running){
      if(remainingSeconds <= 0){
        remainingSeconds = totalSeconds > 0 ? totalSeconds : 60;
        totalSeconds = remainingSeconds;
      }
      startTs = Date.now() - (totalSeconds - remainingSeconds)*1000;
      running = true;
      startBtn.textContent = '⏸️ 暫停';
    } else {
      running = false;
      startBtn.textContent = '▶️ 開始';
    }
  });

  card.querySelector('[data-action="reset"]').addEventListener('click', () => {
    running = false; celebrating = false; particles = [];
    remainingSeconds = totalSeconds;
    startBtn.textContent = '▶️ 開始';
  });

  const ro = new ResizeObserver(() => setupCanvas());
  ro.observe(wrap);
  setupCanvas();
  loop();

  return {
    destroy(){
      cancelAnimationFrame(rafId);
      ro.disconnect();
    }
  };
}

/* ============================================================
   4.65 ⏲️ 正數計時器（碼表，格式沿用小熊時鐘設計）
   ============================================================ */
function initStopwatchTool(card){
  const canvas = card.querySelector('.tool-canvas');
  const wrap = card.querySelector('.tool-canvas-wrap');
  const startBtn = card.querySelector('[data-action="startpause"]');

  let ctx, cssW = 0, cssH = 0;
  let elapsedSeconds = 0;
  let running = false;
  let startTs = 0;
  let rafId = null;

  function setupCanvas(){
    const r = setupHiDPICanvas(canvas, wrap);
    ctx = r.ctx; cssW = r.cssW; cssH = r.cssH;
  }

  function fmt(s){
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s/60), sec = s%60;
    return String(m).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
  }

  function drawCat(){
    const cx = cssW/2, cy = cssH*0.4;
    const r = Math.max(18, Math.min(cssW, cssH) * 0.24);
    const ringR = r + Math.max(8, r*0.22);
    const fraction = (elapsedSeconds % 60) / 60; // 每分鐘繞一圈，給老師一個「正在走」的視覺回饋

    ctx.lineWidth = Math.max(6, r*0.16);
    ctx.strokeStyle = '#FFE6EF';
    ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, Math.PI*2); ctx.stroke();

    ctx.strokeStyle = '#C792EA';
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, -Math.PI/2, -Math.PI/2 + Math.PI*2*fraction);
    ctx.stroke();
    ctx.lineCap = 'butt';

    if(running){
      const ang = -Math.PI/2 + Math.PI*2*fraction;
      ctx.strokeStyle = '#5C4B51';
      ctx.lineWidth = Math.max(2, r*0.05);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + Math.cos(ang)*ringR, cy + Math.sin(ang)*ringR);
      ctx.stroke();
    }

    // 三角耳朵
    function earTri(sign){
      const baseOuterX = cx + sign*r*0.78, baseOuterY = cy - r*0.58;
      const baseInnerX = cx + sign*r*0.22, baseInnerY = cy - r*0.9;
      const tipX = cx + sign*r*0.48, tipY = cy - r*1.28;
      ctx.fillStyle = '#F0DCC0';
      ctx.beginPath();
      ctx.moveTo(baseOuterX, baseOuterY);
      ctx.lineTo(tipX, tipY);
      ctx.lineTo(baseInnerX, baseInnerY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#D9BFA0'; ctx.lineWidth = Math.max(1.5, r*0.04); ctx.stroke();

      const lerp = (a,b,t) => a + (b-a)*t;
      const midX = (baseOuterX+baseInnerX+tipX)/3, midY = (baseOuterY+baseInnerY+tipY)/3;
      ctx.fillStyle = '#FFC9DA';
      ctx.beginPath();
      ctx.moveTo(lerp(midX, baseOuterX, 0.6), lerp(midY, baseOuterY, 0.6));
      ctx.lineTo(lerp(midX, tipX, 0.6), lerp(midY, tipY, 0.6));
      ctx.lineTo(lerp(midX, baseInnerX, 0.6), lerp(midY, baseInnerY, 0.6));
      ctx.closePath();
      ctx.fill();
    }
    earTri(-1);
    earTri(1);

    // 頭
    ctx.fillStyle = '#FFF3E2';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#D9BFA0'; ctx.lineWidth = Math.max(2, r*0.08); ctx.stroke();

    // 腮紅
    ctx.fillStyle = 'rgba(255,159,190,0.55)';
    ctx.beginPath(); ctx.ellipse(cx-r*0.42, cy+r*0.16, r*0.15, r*0.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+r*0.42, cy+r*0.16, r*0.15, r*0.1, 0, 0, Math.PI*2); ctx.fill();

    // 鬍鬚
    ctx.strokeStyle = 'rgba(92,75,81,0.55)';
    ctx.lineWidth = Math.max(1, r*0.025);
    [-1, 1].forEach(side => {
      for(let i=0;i<3;i++){
        const y0 = cy + r*0.12 + i*r*0.07;
        ctx.beginPath();
        ctx.moveTo(cx + side*r*0.28, y0);
        ctx.lineTo(cx + side*r*0.8, y0 - i*r*0.03);
        ctx.stroke();
      }
    });

    // 眼睛
    ctx.fillStyle = '#5C4B51';
    ctx.beginPath(); ctx.arc(cx-r*0.28, cy-r*0.06, r*0.08, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+r*0.28, cy-r*0.06, r*0.08, 0, Math.PI*2); ctx.fill();

    // 鼻子（小三角形）
    ctx.fillStyle = '#FF9FBE';
    ctx.beginPath();
    ctx.moveTo(cx-r*0.06, cy+r*0.12);
    ctx.lineTo(cx+r*0.06, cy+r*0.12);
    ctx.lineTo(cx, cy+r*0.2);
    ctx.closePath();
    ctx.fill();

    // 嘴巴（貓咪 w 型微笑）
    ctx.strokeStyle = '#5C4B51';
    ctx.lineWidth = Math.max(1.5, r*0.045);
    ctx.beginPath();
    ctx.moveTo(cx, cy+r*0.2);
    ctx.lineTo(cx, cy+r*0.26);
    ctx.moveTo(cx, cy+r*0.26);
    ctx.quadraticCurveTo(cx-r*0.1, cy+r*0.32, cx-r*0.2, cy+r*0.24);
    ctx.moveTo(cx, cy+r*0.26);
    ctx.quadraticCurveTo(cx+r*0.1, cy+r*0.32, cx+r*0.2, cy+r*0.24);
    ctx.stroke();

    // 指針已改到圓環繪製後方（與小熊一致），此處不再重複繪製

    const fontSize = Math.max(34, r*1.15);
    const textY = Math.min(cssH - fontSize*0.6, cy + ringR + Math.max(34, r*0.75));
    ctx.fillStyle = '#5C4B51';
    ctx.font = `800 ${fontSize}px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(fmt(elapsedSeconds), cx, textY);
  }

  function render(){
    ctx.clearRect(0, 0, cssW, cssH);
    drawCat();
  }

  function loop(){
    if(running){
      elapsedSeconds = (Date.now() - startTs)/1000;
    }
    render();
    rafId = requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => {
    if(!running){
      startTs = Date.now() - elapsedSeconds*1000;
      running = true;
      startBtn.textContent = '⏸️ 暫停';
    } else {
      running = false;
      startBtn.textContent = '▶️ 開始';
    }
  });

  card.querySelector('[data-action="reset"]').addEventListener('click', () => {
    running = false;
    elapsedSeconds = 0;
    startBtn.textContent = '▶️ 開始';
  });

  const ro = new ResizeObserver(() => setupCanvas());
  ro.observe(wrap);
  setupCanvas();
  loop();

  return {
    destroy(){
      cancelAnimationFrame(rafId);
      ro.disconnect();
    }
  };
}

/* ============================================================
   4.7 🎲 幸運抽籤器（拉霸滾動 + Pop-up 特效，HDPI 優化）
   ============================================================ */
function initDrawTool(card){
  const canvas = card.querySelector('.tool-canvas');
  const wrap = card.querySelector('.tool-canvas-wrap');
  const totalInput = card.querySelector('.input-total');
  const countInput = card.querySelector('.input-count');
  const drawBtn = card.querySelector('[data-action="draw"]');
  const resetHistoryBtn = card.querySelector('[data-action="reset-history"]');
  const resultsEl = card.querySelector('.draw-results');
  const historyEl = card.querySelector('.draw-history');

  let ctx, cssW = 0, cssH = 0;
  let rafId = null;
  let rolling = false;
  let drawnNumbers = new Set(); // 已抽過的號碼（清空紀錄前不會再被抽到）

  function renderHistory(){
    historyEl.innerHTML = '';
    if(drawnNumbers.size === 0){
      const empty = document.createElement('div');
      empty.className = 'placeholder-note';
      empty.textContent = '（尚未抽過）';
      historyEl.appendChild(empty);
      return;
    }
    [...drawnNumbers].sort((a,b) => a-b).forEach(n => {
      const chip = document.createElement('div');
      chip.className = 'mini-btn';
      chip.style.background = 'var(--blue)';
      chip.textContent = `${String(n).padStart(2,'0')} 號`;
      historyEl.appendChild(chip);
    });
  }

  function setupCanvas(){
    const r = setupHiDPICanvas(canvas, wrap);
    ctx = r.ctx; cssW = r.cssW; cssH = r.cssH;
    drawStatic('?');
  }

  function frameBox(){
    ctx.fillStyle = '#FFFFFF';
    drawRoundRect(ctx, cssW*0.08, cssH*0.12, cssW*0.84, cssH*0.76, 22);
    ctx.fill();
    ctx.strokeStyle = '#FF9FBE';
    ctx.lineWidth = 4;
    drawRoundRect(ctx, cssW*0.08, cssH*0.12, cssW*0.84, cssH*0.76, 22);
    ctx.stroke();
  }

  function drawStatic(text, scale=1){
    ctx.clearRect(0, 0, cssW, cssH);
    frameBox();
    const cx = cssW/2, cy = cssH/2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scale, scale);
    ctx.fillStyle = '#5C4B51';
    ctx.font = `800 ${Math.min(cssW, cssH)*0.34}px 'Baloo 2', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function easeOutCubic(t){ return 1 - Math.pow(1-t, 3); }

  function rollTo(target, poolMax){
    return new Promise(resolve => {
      const N = 30;
      const reel = [];
      for(let i=0;i<N-1;i++) reel.push(1 + Math.floor(Math.random()*poolMax));
      reel.push(target);
      const duration = 1800;
      const start = performance.now();
      const cx = cssW/2, cy = cssH/2;
      const rowH = Math.min(cssW, cssH) * 0.34;
      let lastTickIndex = -1;

      function frame(now){
        const t = Math.min(1, (now-start)/duration);
        const eased = easeOutCubic(t);
        const pos = eased * (N-1);
        const baseIndex = Math.floor(pos);
        const frac = pos - baseIndex;

        if(baseIndex !== lastTickIndex){
          lastTickIndex = baseIndex;
          playRollTickSound();
        }

        ctx.clearRect(0, 0, cssW, cssH);
        frameBox();
        ctx.save();
        drawRoundRect(ctx, cssW*0.08, cssH*0.12, cssW*0.84, cssH*0.76, 22);
        ctx.clip();
        for(let k=-1; k<=2; k++){
          const idx = Math.min(N-1, Math.max(0, baseIndex+k));
          const y = cy + (k - 1 - frac) * rowH;
          const dist = Math.abs(k - 1 - frac);
          const alpha = Math.max(0.12, 1 - dist*0.7);
          const fontScale = Math.max(0.45, 1 - dist*0.38);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#5C4B51';
          ctx.font = `800 ${Math.min(cssW, cssH)*0.32*fontScale}px 'Baloo 2', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(String(reel[idx]).padStart(2,'0'), cx, y);
        }
        ctx.restore();
        ctx.globalAlpha = 1;

        if(t < 1){
          rafId = requestAnimationFrame(frame);
        } else {
          resolve();
        }
      }
      rafId = requestAnimationFrame(frame);
    });
  }

  function popReveal(number){
    return new Promise(resolve => {
      playRevealChime();
      const duration = 500;
      const start = performance.now();
      const text = String(number).padStart(2,'0');
      function frame(now){
        const t = Math.min(1, (now-start)/duration);
        let scale;
        if(t < 0.6) scale = 1 + (t/0.6)*0.35;
        else scale = 1.35 - ((t-0.6)/0.4)*0.35;
        drawStatic(text, scale);
        if(t < 1) rafId = requestAnimationFrame(frame);
        else resolve();
      }
      rafId = requestAnimationFrame(frame);
    });
  }

  async function startDraw(){
    if(rolling) return;
    const total = Math.max(1, Math.min(30, parseInt(totalInput.value, 10) || 30));
    let count = Math.max(1, Math.min(5, parseInt(countInput.value, 10) || 1));
    totalInput.value = total;

    const availablePool = Array.from({length: total}, (_, i) => i+1).filter(n => !drawnNumbers.has(n));

    if(availablePool.length === 0){
      showToast('⚠️ 全班都已經抽過囉，請先「清空紀錄」再繼續！');
      return;
    }
    if(count > availablePool.length){
      count = availablePool.length;
      showToast(`⚠️ 剩餘可抽人數不足，已自動調整為 ${count} 人`);
    }
    countInput.value = count;

    const pool = availablePool.slice();
    const picked = [];
    for(let i=0;i<count;i++){
      const idx = Math.floor(Math.random()*pool.length);
      picked.push(pool.splice(idx,1)[0]);
    }

    rolling = true;
    drawBtn.disabled = true;
    resultsEl.innerHTML = '';

    for(const num of picked){
      await rollTo(num, total);
      await popReveal(num);
      drawnNumbers.add(num);
      const chip = document.createElement('div');
      chip.className = 'mini-btn';
      chip.style.background = 'var(--green)';
      chip.textContent = `🎉 ${String(num).padStart(2,'0')} 號`;
      resultsEl.appendChild(chip);
      renderHistory();
      await new Promise(r => setTimeout(r, 350));
    }

    rolling = false;
    drawBtn.disabled = false;
  }

  drawBtn.addEventListener('click', startDraw);

  resetHistoryBtn.addEventListener('click', () => {
    if(rolling) return;
    drawnNumbers.clear();
    resultsEl.innerHTML = '';
    renderHistory();
    showToast('🔄 已清空抽籤紀錄！');
  });

  renderHistory();

  const ro = new ResizeObserver(() => setupCanvas());
  ro.observe(wrap);
  setupCanvas();

  return {
    destroy(){
      cancelAnimationFrame(rafId);
      ro.disconnect();
    }
  };
}

/* ============================================================
   4.8 共用小工具：文字轉義、名單解析
   ============================================================ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, ch => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[ch]));
}

function parseRosterLines(text){
  return text.split('\n').map(l => l.trim()).filter(Boolean).map((line, i) => {
    const m = line.match(/^(\d+)[\s,、.]+(.*)$/);
    if(m) return { seat: parseInt(m[1], 10), name: m[2].trim() || `第${m[1]}號` };
    const n = line.match(/^(\d+)$/);
    if(n) return { seat: parseInt(n[1], 10), name: `第${n[1]}號` };
    return { seat: i+1, name: line };
  });
}

function parseListLines(text){
  return text.split('\n').map(l => l.trim()).filter(Boolean);
}

function sortedStudents(){
  return classState.students.slice().sort((a,b) => a.seat - b.seat);
}

        async function callGemini(prompt, retries = 5) {
            const localApiKey = localStorage.getItem("class_pet_gemini_api_key") || "";
            if (!localApiKey) {
                petShowModal("🔑 提示", "請先至「💾 資料管理」分頁中，輸入並儲存您的 Gemini API 金鑰！<br><br><small>您可以至 Google AI Studio 免費申請 Gemini API 金鑰。</small>");
                throw new Error("API key missing");
            }
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${localApiKey}`;
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try { const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) }); if (!res.ok) throw new Error(); return await res.json(); } 
                catch (error) { if (i === retries - 1) throw error; await new Promise(r => setTimeout(r, delay)); delay *= 2; }
            }
        }

            if(s.exp < 0) { if(s.level > 1) { s.level--; s.exp += 100; } else { s.exp = 0; } }
            if (up) {
